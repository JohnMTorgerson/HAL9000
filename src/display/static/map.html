<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HAL Map</title>

    <!-- Local styles for the embedded map -->
    <link rel="stylesheet" href="/static/map.css" />

    <!-- MapLibre GL -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script defer src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- Your map logic (reads URL params like ?key=...&lat=...&lon=...&zoom=...&places=[...]) -->
    <script defer src="/static/map.js"></script>

    <!-- Keep the iframe background transparent and remove default margins -->
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
    </style>
</head>

<body>
    <!-- Container the JS will render into -->
    <div id="map-root" aria-label="Map viewport">
        <div id="map"></div>
    </div>

    <!-- Example params:
       /static/map.html?key=YOUR_MAPTILER_KEY&lat=44.98&lon=-93.27&zoom=13&fitBounds=true&places=[{"name":"Bryant Hardware","lat":44.95,"lon":-93.29}]
  -->
</body>

</html>
